name = "sun-runners-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Subdomain se asigna automáticamente al primer deploy.
# La URL final será: https://sun-runners-api.<subdomain>.workers.dev

# ──────────────────────────────────────────────────────────
# Static Assets — sirve el frontend (HTML/CSS/JS/fonts/SVG)
# Las rutas no estáticas (/api/*) caen al Worker script.
# ──────────────────────────────────────────────────────────
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ──────────────────────────────────────────────────────────
# D1 Database binding
# ──────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "sun-runners-db"
database_id = "84368f8a-9c9b-44af-bbf2-c86895ba2e11"

# ──────────────────────────────────────────────────────────
# Variables de entorno (públicas — no sensibles)
# Las sensibles van como secrets vía `wrangler secret put`
# ──────────────────────────────────────────────────────────
[vars]
CORS_ORIGIN = "*"
ENVIRONMENT = "production"

# Secrets requeridos (setear con wrangler secret put <NAME>):
#   BREVO_API_KEY       — API key de Brevo (xkeysib-...)
#   BREVO_FROM_EMAIL    — Gmail verificado en Brevo (sunrunners.cuba@gmail.com)
#   BREVO_FROM_NAME     — "SUN-RUNNERS"
#   BREVO_NOTIFY_EMAIL  — Email central para copias (mismo Gmail)
#   WHATSAPP_PUBLIC_NUMBER — +53500000000 (para link wa.me en emails)

# ──────────────────────────────────────────────────────────
# Observabilidad
# ──────────────────────────────────────────────────────────
[observability]
enabled = true
