name = "sun-runers"
compatibility_date = "2024-12-01"

# Servir assets estáticos desde ./public
# Esto crea un Worker que sirve el HTML estático desde workers.dev
# (rango de IPs distinto a pages.dev — útil si ETECSA bloquea pages.dev)
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# Sin `main` — el Worker se sirve puramente como assets estáticos.
# Si en el futuro necesitamos lógica de routing (ej. reescribir URLs),
# añadiremos main + binding ASSETS para delegar a los assets.
