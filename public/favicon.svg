<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- HELORA monograma H — dos flechas ascendentes que forman la letra.
       Concepto: flujo de energía ascendente + conexión + nodo. -->
  <rect width="32" height="32" rx="7" fill="#0F100C"/>
  <path d="M9 7 L9 25 M23 7 L23 25 M9 16 L23 16"
        stroke="#F7F5EF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Pequeña marca de energía ascendente -->
  <path d="M13 11 L16 8 L19 11" stroke="#B8702E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M13 21 L16 24 L19 21" stroke="#B8702E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
